  <rect x="0" y="0" width="940" height="720" fill="#fafafa"/>
  <text x="24" y="30" class="h" font-size="19">Structured Report  —  FULL tier (summary + strips + trends + full disclosure)</text>
  <text x="24" y="48" class="muted">Multi-section PDF. Analysis runs over the whole recording; only summary + representative strips are printed.</text>

  <!-- ================= PAGE 1: SUMMARY ================= -->
