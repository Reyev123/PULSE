<svg xmlns="http://www.w3.org/2000/svg" width="940" height="720" viewBox="0 0 940 720" font-family="Arial, Helvetica, sans-serif">
  <style>
    .page{fill:#fff;stroke:#c9c9c9;stroke-width:1}
    .lbl{fill:#555;font-size:11px}
    .h{fill:#1a2b3c;font-weight:bold}
    .muted{fill:#999;font-size:10px}
    .grid{stroke:#f2cccc;stroke-width:1}
    .ecg{fill:none;stroke:#111;stroke-width:1.1}
    .rule{stroke:#e2e2e2;stroke-width:1}
    .kv{font-size:11px}
    .tag{font-size:10px;font-weight:bold}
    .sec{fill:#1a6ebd;font-size:12px;font-weight:bold}
